import groovy.json.JsonSlurper

import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'maven-publish'
}

def mcVersion = providers.gradleProperty('mcVersion').orElse('26.3').get()
def versionFile = file("versions/${mcVersion}.properties")

if (!versionFile.exists()) {
    throw new GradleException("Unsupported Minecraft version: ${mcVersion}")
}

def mcProperties = new Properties()

versionFile.withInputStream {
    mcProperties.load(it)
}

mcProperties.each { key, value ->
    ext[key.toString()] = value.toString()
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply from: rootProject.file('gradle/resources-revalidation.gradle')

    version = project.mod_version
    group = project.mod_group

    repositories {
        mavenCentral()

        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = Integer.parseInt(project.java_version)
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(project.java_version)
        }

        withSourcesJar()
    }
}

tasks.register('copyArtifacts', Copy) {
    dependsOn ':fabric:build', ':neoforge:build'

    from project(':fabric').layout.buildDirectory.dir('libs')
    from project(':neoforge').layout.buildDirectory.dir('libs')

    into layout.buildDirectory.dir('libs')
}

tasks.register('build') {
    dependsOn ':fabric:build', ':neoforge:build'
    finalizedBy 'copyArtifacts'
}